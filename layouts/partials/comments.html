<div style="text-align: center; margin: 40px 0;">
  <button id="twikoo-toggle" class="twikoo-toggle-btn">[ Show Comments ]</button>
</div>

<div id="twikoo-wrapper" class="twikoo-wrapper">
  <div id="tcomment"></div>
</div>
<style>
  /* 前面的按钮和容器样式保持不变... */
  .twikoo-toggle-btn {
    background: transparent;
    border: 1px solid rgba(0, 0, 0, 0); 
    color: #888; 
    padding: 10px 24px;
    font-size: 14px;
    font-family: 'Noto Serif', 'Noto Serif JP', 'Noto Serif SC', Georgia, serif;
    letter-spacing: 0.5px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.4s ease;
    outline: none;
  }
  
  .twikoo-toggle-btn:hover {
    border-color: #4A90E2;
    color: #4A90E2;
    background-color: rgba(74, 144, 226, 0.03);
  }

  .twikoo-wrapper {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
  }
  
  .twikoo-wrapper.expanded {
    max-height: 5000px;
    opacity: 1;
    margin-top: 20px;
  }

  /* 核心修正：稍微加强并延长了动画的时间 (4s) */
  /* 核心修正：三次递减的呼吸闪烁 (4.5s) */
  @keyframes resonance-pulse {
    0%   { background-color: transparent; }
    
    /* 第一次，清晰 */
    12%  { background-color: rgba(74, 144, 226, 0.16); } 
    28%  { background-color: transparent; }
    
    /* 第二次，柔和 */
    45%  { background-color: rgba(74, 144, 226, 0.13); } 
    62%  { background-color: transparent; }
    
    /* 第三次，微弱 */
    82%  { background-color: rgba(74, 144, 226, 0.08); } 
    100% { background-color: transparent; }
  }

  .target-comment-flash {
    animation: resonance-pulse 4.5s ease-in-out forwards;
    border-radius: 6px; 
  }




/* Twikoo 在 Vue 挂载后会替换 #tcomment；
   因此必须以外层仍然存在的 .twikoo-wrapper 为锚点。 */

/* 英文按完整单词换行，不再 bee / n、reco / mmend */
.twikoo-wrapper .tk-comment,
.twikoo-wrapper .tk-comment * {
  word-break: normal !important;
  overflow-wrap: normal !important;
  word-wrap: normal !important;
  hyphens: none !important;
}

/* 只有特别长的 URL、代码字符串才允许在必要时折行 */
.twikoo-wrapper .tk-content a,
.twikoo-wrapper .tk-content code,
.twikoo-wrapper .tk-content pre {
  overflow-wrap: anywhere;
  word-break: normal !important;
}

/* Markdown 链接 */
.twikoo-wrapper .tk-content a {
  color: rgb(var(--color-primary-400)) !important;
  text-decoration: none !important;
}

.twikoo-wrapper .tk-content a:hover {
  color: rgb(var(--color-primary-400)) !important;
  text-decoration: none !important;
}


/* Markdown 标题 */
.twikoo-wrapper .tk-content h1,
.twikoo-wrapper .tk-content h2,
.twikoo-wrapper .tk-content h3,
.twikoo-wrapper .tk-content h4,
.twikoo-wrapper .tk-content h5,
.twikoo-wrapper .tk-content h6 {
  display: block;
  margin: 1.05em 0 0.45em;
  font-weight: 700;
  line-height: 1.3;
}

.twikoo-wrapper .tk-content h1 { font-size: 1.45em; }
.twikoo-wrapper .tk-content h2 { font-size: 1.30em; }
.twikoo-wrapper .tk-content h3 { font-size: 1.18em; }
.twikoo-wrapper .tk-content h4,
.twikoo-wrapper .tk-content h5,
.twikoo-wrapper .tk-content h6 { font-size: 1.08em; }

/* Markdown 段落、列表、图片 */
.twikoo-wrapper .tk-content p {
  margin: 0.7em 0;
}

.twikoo-wrapper .tk-content p:first-child {
  margin-top: 0;
}

.twikoo-wrapper .tk-content p:last-child {
  margin-bottom: 0;
}

.twikoo-wrapper .tk-content ul,
.twikoo-wrapper .tk-content ol {
  margin: 0.7em 0;
  padding-left: 1.4em;
}

.twikoo-wrapper .tk-content img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0.75em 0;
  border-radius: 0.35rem;
}

/* 评论排序：文字式下拉控件，而不是按钮 */

.twikoo-wrapper .tk-comments-sort {
  position: relative;
  display: inline-block;
  color: rgb(var(--color-neutral-800));
}

.dark .twikoo-wrapper .tk-comments-sort {
  color: rgb(var(--color-neutral-100));
}

/* 为未支持 base-select 的浏览器准备的箭头 */
.twikoo-wrapper .tk-comments-sort::after {
  content: "⌄";
  position: absolute;
  top: 50%;
  right: 0.18rem;
  transform: translateY(-56%);
  pointer-events: none;
  color: currentColor;
  font-size: 0.95em;
  line-height: 1;
  transition: color 0.24s ease, transform 0.24s ease;
}

.twikoo-wrapper .tk-sort-select {
  appearance: none;
  -webkit-appearance: none;

  min-height: 2.35rem;
  padding: 0.42rem 1.35rem 0.48rem 0.28rem !important;

  border: 0 !important;
  border-radius: 0 !important;
  outline: 0 !important;
  box-shadow: none !important;

  color: inherit !important;
  background-color: transparent !important;
  background-image: linear-gradient(currentColor, currentColor) !important;
  background-repeat: no-repeat !important;
  background-position: 0.28rem calc(100% - 3px) !important;
  background-size: 0 1px !important;

  font-family: 'Noto Serif', 'Noto Serif JP', 'Noto Serif SC', Georgia, serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;

  transition:
    color 0.24s ease,
    background-size 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 悬停与键盘聚焦：主题色下划线从左向右展开 */
.twikoo-wrapper .tk-sort-select:hover,
.twikoo-wrapper .tk-sort-select:focus-visible {
  color: rgb(var(--color-primary-400)) !important;
  background-size: calc(100% - 1.45rem) 1px !important;
}

.twikoo-wrapper .tk-comments-sort:hover::after,
.twikoo-wrapper .tk-comments-sort:focus-within::after {
  color: rgb(var(--color-primary-400));
}

/* 新版 Edge / Chromium：接管下拉列表，消除原生白色底边 */
@supports (appearance: base-select) {
  .twikoo-wrapper .tk-sort-select,
  .twikoo-wrapper .tk-sort-select::picker(select) {
    appearance: base-select;
  }

  /* 改用浏览器提供的可动画箭头，避免双箭头 */
  .twikoo-wrapper .tk-comments-sort::after {
    content: none;
  }

  .twikoo-wrapper .tk-sort-select::picker-icon {
    color: currentColor;
    margin-left: 0.28rem;
    transition: rotate 0.24s ease;
  }

  .twikoo-wrapper .tk-sort-select:open {
    color: rgb(var(--color-primary-400)) !important;
    background-size: calc(100% - 1.45rem) 1px !important;
  }

  .twikoo-wrapper .tk-sort-select:open::picker-icon {
    rotate: 180deg;
  }

  /* 下拉列表本体 */
  .twikoo-wrapper .tk-sort-select::picker(select) {
    margin-top: 0.35rem;
    padding: 0.25rem 0;
    min-width: 7rem;

    color: rgb(var(--color-neutral-800));
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid rgba(15, 23, 42, 0.13);
    border-radius: 6px;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
  }

  .dark .twikoo-wrapper .tk-sort-select::picker(select) {
    color: rgb(var(--color-neutral-100));
    background: rgba(30, 41, 59, 0.97);
    border-color: rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
  }

  /* 各选项 */
  .twikoo-wrapper .tk-sort-select option {
    padding: 0.52rem 0.82rem;
    color: inherit;
    background: transparent;
    border: 0;
    font-family: 'Noto Serif', 'Noto Serif JP', 'Noto Serif SC', Georgia, serif;
    font-weight: 700;
  }

  .twikoo-wrapper .tk-sort-select option:hover,
  .twikoo-wrapper .tk-sort-select option:focus {
    background: rgba(var(--color-primary-400), 0.12);
  }

  .twikoo-wrapper .tk-sort-select option:checked {
    color: rgb(var(--color-primary-400));
    background: rgba(var(--color-primary-400), 0.14);
  }

  /* 不额外显示勾选符号，保持简洁 */
  .twikoo-wrapper .tk-sort-select::checkmark {
    content: "";
  }
}

<script src="https://cdn.jsdelivr.net/npm/twikoo@1.7.1/dist/twikoo.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('twikoo-toggle');
    const wrapper = document.getElementById('twikoo-wrapper');
    let isTwikooLoaded = false;

    function expandAndLoadTwikoo() {
      wrapper.classList.add('expanded');
      toggleBtn.innerText = '[ Hide Comments ]';

      if (!isTwikooLoaded) {
        twikoo.init({
          envId: 'https://twikoo.jukai.site',
          el: '#tcomment',
          lang: 'en-us',
          onCommentLoaded: function () {
            const currentHash = window.location.hash;
            if (currentHash && /^#[0-9a-fA-F]{24,32}$/.test(currentHash)) {
              const targetId = currentHash.substring(1);
              const targetElement = document.getElementById(targetId);
              
              if (targetElement) {
                // 等待极短时间让 DOM 结构稳定，然后立刻触发平滑滚动
                setTimeout(() => {
                  // 计算目标位置，-100 像素避免评论紧贴浏览器顶端
                  const y = targetElement.getBoundingClientRect().top + window.scrollY - 100;
                  window.scrollTo({ top: y, behavior: 'smooth' });
                  
                  // 等待平滑滚动完成后，注入闪烁动画
                  // 这样当访客的视线正好落在该评论上时，它才开始优雅地“亮起”
                  setTimeout(() => {
                    targetElement.classList.add('target-comment-flash');
                  }, 800);
                  
                }, 100); 
              }
            }
          }
        });
        isTwikooLoaded = true;
      }
    }

    toggleBtn.addEventListener('click', function () {
      if (wrapper.classList.contains('expanded')) {
        wrapper.classList.remove('expanded');
        toggleBtn.innerText = '[ Show Comments ]';
      } else {
        expandAndLoadTwikoo();
      }
    });

    const initialHash = window.location.hash;
    if (initialHash && /^#[0-9a-fA-F]{24,32}$/.test(initialHash)) {
      expandAndLoadTwikoo();
    }
  });







    // 再次点击当前排序时，收起已展开的排序列表
    document.addEventListener('pointerdown', function (event) {
      const target = event.target;

      if (!(target instanceof Element)) return;

      const select = target.closest('.twikoo-wrapper .tk-sort-select');


      if (!select || target !== select || !select.matches(':open')) return;

      event.preventDefault();
      select.blur();
    }, true);


</script>
