<div style="text-align: center; margin: 40px 0;">
  <button id="twikoo-toggle" class="twikoo-toggle-btn">[ Show Comments ]</button>
</div>

<div id="twikoo-wrapper" class="twikoo-wrapper">
  <div id="tcomment"></div>
</div>
<style>
  /* 前面的按钮和容器样式保持不变... */
  .twikoo-toggle-btn {
    background: transparent;
    border: 1px solid rgba(0, 0, 0, 0); 
    color: #888; 
    padding: 10px 24px;
    font-size: 14px;
    font-family: 'Noto Serif', 'Noto Serif JP', 'Noto Serif SC', Georgia, serif;
    letter-spacing: 0.5px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.4s ease;
    outline: none;
  }
  
  .twikoo-toggle-btn:hover {
    border-color: #4A90E2;
    color: #4A90E2;
    background-color: rgba(74, 144, 226, 0.03);
  }

  .twikoo-wrapper {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
  }
  
  .twikoo-wrapper.expanded {
    max-height: 5000px;
    opacity: 1;
    margin-top: 20px;
  }

  /* 核心修正：稍微加强并延长了动画的时间 (4s) */
  /* 核心修正：三次递减的呼吸闪烁 (4.5s) */
  @keyframes resonance-pulse {
    0%   { background-color: transparent; }
    
    /* 第一次，清晰 */
    12%  { background-color: rgba(74, 144, 226, 0.16); } 
    28%  { background-color: transparent; }
    
    /* 第二次，柔和 */
    45%  { background-color: rgba(74, 144, 226, 0.13); } 
    62%  { background-color: transparent; }
    
    /* 第三次，微弱 */
    82%  { background-color: rgba(74, 144, 226, 0.08); } 
    100% { background-color: transparent; }
  }

  .target-comment-flash {
    animation: resonance-pulse 4.5s ease-in-out forwards;
    border-radius: 6px; 
  }




/* Twikoo 在 Vue 挂载后会替换 #tcomment；
   因此必须以外层仍然存在的 .twikoo-wrapper 为锚点。 */

/* 英文按完整单词换行，不再 bee / n、reco / mmend */
.twikoo-wrapper .tk-comment,
.twikoo-wrapper .tk-comment * {
  word-break: normal !important;
  overflow-wrap: normal !important;
  word-wrap: normal !important;
  hyphens: none !important;
}

/* 只有特别长的 URL、代码字符串才允许在必要时折行 */
.twikoo-wrapper .tk-content a,
.twikoo-wrapper .tk-content code,
.twikoo-wrapper .tk-content pre {
  overflow-wrap: anywhere;
  word-break: normal !important;
}

/* Markdown 链接 */
.twikoo-wrapper .tk-content a {
  color: rgb(var(--color-primary-400)) !important;
  text-decoration: none !important;
}

.twikoo-wrapper .tk-content a:hover {
  color: rgb(var(--color-primary-400)) !important;
  text-decoration: none !important;
}


/* Markdown 标题 */
.twikoo-wrapper .tk-content h1,
.twikoo-wrapper .tk-content h2,
.twikoo-wrapper .tk-content h3,
.twikoo-wrapper .tk-content h4,
.twikoo-wrapper .tk-content h5,
.twikoo-wrapper .tk-content h6 {
  display: block;
  margin: 1.05em 0 0.45em;
  font-weight: 700;
  line-height: 1.3;
}

.twikoo-wrapper .tk-content h1 { font-size: 1.45em; }
.twikoo-wrapper .tk-content h2 { font-size: 1.30em; }
.twikoo-wrapper .tk-content h3 { font-size: 1.18em; }
.twikoo-wrapper .tk-content h4,
.twikoo-wrapper .tk-content h5,
.twikoo-wrapper .tk-content h6 { font-size: 1.08em; }

/* Markdown 段落、列表、图片 */
.twikoo-wrapper .tk-content p {
  margin: 0.7em 0;
}

.twikoo-wrapper .tk-content p:first-child {
  margin-top: 0;
}

.twikoo-wrapper .tk-content p:last-child {
  margin-bottom: 0;
}

.twikoo-wrapper .tk-content ul,
.twikoo-wrapper .tk-content ol {
  margin: 0.7em 0;
  padding-left: 1.4em;
}

.twikoo-wrapper .tk-content img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0.75em 0;
  border-radius: 0.35rem;
}





</style>

<script src="https://cdn.jsdelivr.net/npm/twikoo@1.7.1/dist/twikoo.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('twikoo-toggle');
    const wrapper = document.getElementById('twikoo-wrapper');
    let isTwikooLoaded = false;

    function expandAndLoadTwikoo() {
      wrapper.classList.add('expanded');
      toggleBtn.innerText = '[ Hide Comments ]';

      if (!isTwikooLoaded) {
        twikoo.init({
          envId: 'https://twikoo.jukai.site',
          el: '#tcomment',
          lang: 'en-us',
          onCommentLoaded: function () {
            const currentHash = window.location.hash;
            if (currentHash && /^#[0-9a-fA-F]{24,32}$/.test(currentHash)) {
              const targetId = currentHash.substring(1);
              const targetElement = document.getElementById(targetId);
              
              if (targetElement) {
                // 等待极短时间让 DOM 结构稳定，然后立刻触发平滑滚动
                setTimeout(() => {
                  // 计算目标位置，-100 像素避免评论紧贴浏览器顶端
                  const y = targetElement.getBoundingClientRect().top + window.scrollY - 100;
                  window.scrollTo({ top: y, behavior: 'smooth' });
                  
                  // 等待平滑滚动完成后，注入闪烁动画
                  // 这样当访客的视线正好落在该评论上时，它才开始优雅地“亮起”
                  setTimeout(() => {
                    targetElement.classList.add('target-comment-flash');
                  }, 800);
                  
                }, 100); 
              }
            }
          }
        });
        isTwikooLoaded = true;
      }
    }

    toggleBtn.addEventListener('click', function () {
      if (wrapper.classList.contains('expanded')) {
        wrapper.classList.remove('expanded');
        toggleBtn.innerText = '[ Show Comments ]';
      } else {
        expandAndLoadTwikoo();
      }
    });

    const initialHash = window.location.hash;
    if (initialHash && /^#[0-9a-fA-F]{24,32}$/.test(initialHash)) {
      expandAndLoadTwikoo();
    }
  });
</script>
